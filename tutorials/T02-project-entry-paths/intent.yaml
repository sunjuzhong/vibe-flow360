schema_version: 1
engineering_question: Which Project root preserves the right amount of upstream flexibility for the next simulation decision?
decision: Choose Geometry, SurfaceMesh, or VolumeMesh without silently discarding required validation stages.
inputs:
  supported_surface_mesh: cgns, dat, key, msh, nas, bdf, inp, vtk, vtu
  supported_volume_mesh: cgns, dat, key, msh, nas, bdf, inp, vtk, vtu
deliverables:
  - A root-type and resource-tree comparison
  - A stage and validation-context matrix
  - Two configured Flow360 Case Drafts attached to an uploaded mesh Project
