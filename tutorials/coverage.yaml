registry: tutorials/feature-registry.json
api_version: release-25.10
package_version: 25.10.3

# A mapping means the public capability has a teaching home. "planned" becomes
# "verified" only when an artifact exists and passes Flow360 validation.
mappings:
  # Narrow verified mappings override the broader planned teaching homes below.
  - tutorial: T01
    section: baseline
    status: verified
    artifact: tutorials/T01-first-lift-drag/simulation.json
    override: true
    selector:
      feature_pattern: '^schema:(type:SimulationParams|field:SimulationParams\.(version|unit_system|meshing|reference_geometry|operating_condition|models|time_stepping|outputs)|variant:SimulationParams\.(meshing=MeshingParams|models\[\]=(Fluid|Wall|Freestream)|operating_condition=AerospaceCondition|outputs\[\]=(SurfaceOutput|ForceOutput)|time_stepping=Steady))$'
  - tutorial: T01
