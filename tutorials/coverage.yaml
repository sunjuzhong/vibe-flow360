exclusions:
  - reason: Private implementation attributes are not part of the supported user API.
    selector: {feature_pattern: '^schema:field:.*\.private_attribute_'}
  - reason: Pydantic collection wrappers are generated schema plumbing, not user-facing capabilities.
    selector: {owner_pattern: '^(EntityList_|Unique(Item|String)List|abc__UniqueItemList_).*'}
  - reason: Cached constructor inputs are serialization internals and are not authored by users.
    selector: {owner_pattern: '.*Cache$'}
  - reason: Resource metadata and ghost entities are generated by Flow360 services.
    selector:
      owners: [AxisymmetricSegment, BodyComponentInfo, CoordinateSystemEntityRef, CoordinateSystemStatus, GeometryEntityInfo, GhostCircularPlane, GhostSphere, GhostSurface, GhostSurfacePair, MirrorStatus, SurfaceMeshEntityInfo, SurfacePrivateAttributes, VariableContextInfo, VolumeMeshEntityInfo, WindTunnelGhostSurface]
