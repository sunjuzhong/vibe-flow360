values:
  freestream_speed: {value: 20, unit: m/s, provenance: adapted}
  outer_zone_radius: {value: 2.2, unit: m, provenance: adapted}
  inner_zone_radius: {value: 1.1, unit: m, provenance: adapted}
  outer_speed: {value: 200, unit: rpm, provenance: adapted}
  inner_relative_speed: {value: -500, unit: rpm, provenance: adapted}
  inner_absolute_speed: {value: -300, unit: rpm, provenance: derived}
  time_step: {value: 0.001, unit: s, provenance: adapted}
