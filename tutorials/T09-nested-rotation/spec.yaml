review_required:
  - Verify that every rotor surface belongs to the intended rotating zone and no interface intersects solid geometry.
  - Verify that the inner sphere is geometrically contained by the outer cylinder and both Draft entities are registered.
  - Interpret -500 rpm as motion relative to the 200 rpm parent, yielding -300 rpm absolute inner speed.
  - Compare interface mesh quality, time resolution, wake continuity, conservation, and loads before accepting the nested model.
