review_required:
  - Confirm the vehicle coordinate system, floor elevation, wheel centers, and rotation signs.
  - Confirm the tunnel blockage and inlet/outlet distances are acceptable for the intended comparison.
  - Confirm moving surfaces travel at 40 m/s and each wheel tread moves rearward at the contact patch.
  - Compare underbody velocity, wheel wakes, total drag, lift balance, y-plus, and convergence using identical views.
