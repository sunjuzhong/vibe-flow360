name: Tutorial coverage

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "scripts/export_flow360_features.py"
      - "scripts/validate_tutorials.py"
      - "scripts/test_validate_tutorials.py"
      - "cmd/tutorial-coverage/**"
      - "web/**"
      - "README.md"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Flow360 schema package
        run: python -m pip install -r tutorials/validator-requirements.txt "$(python -c 'import json; print(json.load(open("tutorials/flow360-version.json"))["install_spec"])')"
      - name: Verify registry snapshot
        run: python scripts/export_flow360_features.py --check
      - name: Test tutorial validators
        run: |
          python -m unittest scripts/test_validate_tutorials.py
          go test ./cmd/tutorial-coverage
          python tutorials/T01-first-lift-drag/build_simulation.py --check
          python tutorials/T03-cylinder-boundary-layer/build_simulation.py --check
      - name: Test browser tutorial
        run: |
          npm ci --prefix web
          npm run test --prefix web
          npm run build --prefix web
      - name: Validate tutorial contracts and artifacts
        run: python scripts/validate_tutorials.py --output /tmp/tutorial-validation-report.json
      - name: Verify every public feature is accounted for
        run: go run ./cmd/tutorial-coverage --validation-report /tmp/tutorial-validation-report.json
